<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Feature-informed pretraining and downstream transfer</title>
  <desc id="desc">An authentic, axis-labelled PPG example window splits into a fixed TSFEL target path and a trainable neural prediction path. One of four alternative encoder backbones and a feature head are trained with mean squared error. After pretraining the feature head is discarded; a new task head is trained either with the encoder frozen or with the encoder fine-tuned.</desc>
  <style>
    .lane{font:600 15px 'JetBrains Mono','SFMono-Regular',monospace;letter-spacing:1.15px;text-transform:uppercase}
    .title{font:700 20px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .head-title{font:700 18px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .body{font:500 14px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#40505D}
    .body-strong{font:650 14px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .small{font:500 12.5px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#6D7881}
    .axis{font:550 13px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#5E6B75}
    .plot-label{font:650 14px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#40505D}
    .mono{font:500 12.5px 'JetBrains Mono','SFMono-Regular',monospace;fill:#40505D}
    .state{font:600 13.5px 'JetBrains Mono','SFMono-Regular',monospace;fill:#40505D}
    .arch{font:600 13.5px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .equation{font:700 23px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .fixed-field{fill:#EEF6F4;stroke:#26796F;stroke-width:1.5}
    .train-field{fill:#EEF3F8;stroke:#285F8F;stroke-width:1.5}
    .transfer-field{fill:#FAF6EC;stroke:#A36F24;stroke-width:1.35}
    .node{fill:#FFFFFF;stroke:#D7DDE1;stroke-width:1.2}
    .fixed-node{fill:#FFFFFF;stroke:#26796F;stroke-width:1.45}
    .train-node{fill:#FFFFFF;stroke:#285F8F;stroke-width:1.45}
    .loss-node{fill:#FBF1EE;stroke:#A63D32;stroke-width:1.55}
    .flow{fill:none;stroke:#17212B;stroke-width:2;stroke-linejoin:round}
    .fixed-flow{fill:none;stroke:#26796F;stroke-width:2;stroke-linejoin:round}
    .train-flow{fill:none;stroke:#285F8F;stroke-width:2;stroke-linejoin:round}
    .transfer-flow{fill:none;stroke:#6D7881;stroke-width:2.05;stroke-linejoin:round}
    .reuse-flow{fill:none;stroke:#6D7881;stroke-width:1.7;stroke-dasharray:6 5;stroke-linejoin:round}
    .glyph{fill:none;stroke:#285F8F;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
    .glyph-fill{fill:#285F8F}
    .fixed-text{fill:#26796F}
    .train-text{fill:#285F8F}
    .brick-text{fill:#A63D32}
    .gold-text{fill:#A36F24}
  </style>
  <defs>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#17212B"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#26796F"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#285F8F"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A36F24"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6D7881"/>
    </marker>
    <clipPath id="input-clip"><rect x="39" y="151" width="140" height="52" rx="4"/></clipPath>
    <g id="lock-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="7" width="14" height="11" rx="2"/>
      <path d="M4,7V4.7A4,4 0 0 1 12,4.7V7"/>
      <path d="M8,11v3"/>
    </g>
  </defs>

  <!-- Connectors are intentionally drawn before nodes. -->
  <path d="M265,195 H282 V102 H300" class="flow" marker-end="url(#arrow-ink)"/>
  <path d="M282,195 V260 H300" class="flow" marker-end="url(#arrow-ink)"/>
  <path d="M545,105 H575" class="fixed-flow" marker-end="url(#arrow-teal)"/>
  <path d="M795,105 H850 V150 H900" class="fixed-flow" marker-end="url(#arrow-teal)"/>
  <path d="M650,268 H670" class="train-flow" marker-end="url(#arrow-blue)"/>
  <path d="M800,268 H850 V220 H900" class="train-flow" marker-end="url(#arrow-blue)"/>
  <path d="M485,318 V353" class="reuse-flow" marker-end="url(#arrow-muted)"/>
  <path d="M190,438 H226" class="transfer-flow" marker-end="url(#arrow-muted)"/>
  <path d="M358,438 H398" class="transfer-flow" marker-end="url(#arrow-muted)"/>
  <path d="M770,438 H806" class="transfer-flow" marker-end="url(#arrow-muted)"/>
  <path d="M938,438 H978" class="transfer-flow" marker-end="url(#arrow-muted)"/>

    <!-- Authentic input example: PPG-DaLiA Subject 1, source rows 73,120–73,375. -->
  <rect x="20" y="55" width="245" height="280" rx="16" class="node"/>
  <text x="38" y="85" class="title">input window X</text>
  <text x="38" y="108" class="small">PPG-DaLiA · S1 · 256 samples @ 32 Hz</text>
  <text x="65" y="135" class="plot-label">detrended PPG / window σ</text>
  <rect x="63" y="145" width="184" height="116" rx="5" fill="#F7F9FA" stroke="#D7DDE1"/>
  <path d="M65,159.00 H245 M65,203.00 H245 M65,247.00 H245" fill="none" stroke="#D7DDE1" stroke-width="1"/>
  <path d="M65,148 V258 H245" fill="none" stroke="#82909D" stroke-width="1.25"/>
  <text x="59" y="163.00" text-anchor="end" class="axis">+2</text>
  <text x="59" y="207.00" text-anchor="end" class="axis">0</text>
  <text x="59" y="251.00" text-anchor="end" class="axis">−2</text>
  <path d="M65,258 V263 M155,258 V263 M245,258 V263" stroke="#82909D" stroke-width="1.1"/>
  <text x="65" y="276" text-anchor="middle" class="axis">0</text>
  <text x="155" y="276" text-anchor="middle" class="axis">4</text>
  <text x="245" y="276" text-anchor="middle" class="axis">8</text>
  <text x="155" y="296" text-anchor="middle" class="plot-label">time in window (s)</text>
  <path d="M65.00,219.29 L65.70,224.11 L66.41,230.62 L67.11,234.39 L67.81,229.89 L68.52,217.10 L69.22,202.20 L69.92,191.39 L70.63,187.02 L71.33,187.44 L72.03,187.92 L72.73,186.23 L73.44,185.71 L74.14,189.08 L74.84,193.92 L75.55,197.40 L76.25,199.92 L76.95,203.03 L77.66,208.76 L78.36,217.62 L79.06,225.71 L79.77,227.46 L80.47,219.61 L81.17,204.48 L81.88,189.15 L82.58,179.23 L83.28,175.31 L83.98,175.44 L84.69,178.28 L85.39,182.45 L86.09,186.62 L86.80,190.34 L87.50,194.12 L88.20,198.35 L88.91,203.59 L89.61,210.25 L90.31,218.33 L91.02,227.31 L91.72,236.10 L92.42,241.07 L93.13,237.18 L93.83,224.22 L94.53,208.06 L95.23,194.20 L95.94,184.40 L96.64,179.12 L97.34,178.72 L98.05,180.72 L98.75,181.46 L99.45,182.35 L100.16,188.07 L100.86,198.03 L101.56,206.02 L102.27,210.15 L102.97,214.82 L103.67,223.33 L104.38,233.18 L105.08,237.22 L105.78,229.38 L106.48,211.57 L107.19,194.51 L107.89,186.83 L108.59,185.67 L109.30,184.89 L110.00,185.18 L110.70,188.57 L111.41,191.55 L112.11,192.57 L112.81,195.37 L113.52,200.42 L114.22,204.36 L114.92,206.66 L115.63,209.70 L116.33,215.33 L117.03,224.10 L117.73,233.65 L118.44,236.32 L119.14,225.55 L119.84,204.67 L120.55,184.66 L121.25,172.39 L121.95,167.84 L122.66,169.47 L123.36,176.25 L124.06,185.29 L124.77,193.56 L125.47,200.28 L126.17,205.20 L126.88,207.57 L127.58,207.97 L128.28,209.06 L128.98,212.57 L129.69,218.32 L130.39,225.55 L131.09,232.33 L131.80,234.55 L132.50,229.39 L133.20,218.12 L133.91,204.05 L134.61,190.74 L135.31,182.89 L136.02,183.15 L136.72,188.45 L137.42,193.70 L138.13,197.40 L138.83,201.64 L139.53,208.40 L140.23,216.60 L140.94,222.38 L141.64,224.01 L142.34,223.94 L143.05,225.40 L143.75,226.95 L144.45,223.00 L145.16,210.56 L145.86,194.26 L146.56,181.83 L147.27,175.88 L147.97,174.67 L148.67,176.84 L149.38,181.11 L150.08,185.71 L150.78,189.76 L151.48,193.09 L152.19,194.98 L152.89,195.17 L153.59,194.98 L154.30,196.26 L155.00,201.04 L155.70,209.80 L156.41,221.01 L157.11,232.87 L157.81,242.25 L158.52,242.78 L159.22,229.88 L159.92,208.02 L160.63,187.24 L161.33,173.24 L162.03,165.35 L162.73,161.57 L163.44,161.78 L164.14,166.40 L164.84,173.92 L165.55,182.25 L166.25,190.25 L166.95,197.35 L167.66,203.34 L168.36,209.45 L169.06,217.17 L169.77,225.15 L170.47,231.85 L171.17,238.09 L171.88,241.55 L172.58,235.04 L173.28,217.02 L173.98,196.86 L174.69,182.70 L175.39,175.36 L176.09,174.94 L176.80,182.29 L177.50,193.76 L178.20,201.55 L178.91,202.10 L179.61,199.21 L180.31,197.91 L181.02,198.27 L181.72,199.03 L182.42,203.25 L183.13,213.29 L183.83,226.53 L184.53,239.26 L185.23,248.11 L185.94,247.36 L186.64,233.61 L187.34,213.39 L188.05,196.47 L188.75,185.73 L189.45,179.48 L190.16,177.69 L190.86,180.56 L191.56,185.12 L192.27,188.41 L192.97,190.53 L193.67,192.41 L194.38,194.43 L195.08,196.64 L195.78,198.68 L196.48,200.91 L197.19,206.22 L197.89,217.58 L198.59,232.63 L199.30,241.96 L200.00,236.63 L200.70,216.96 L201.41,191.76 L202.11,170.63 L202.81,158.05 L203.52,153.92 L204.22,156.21 L204.92,164.08 L205.63,177.45 L206.33,193.40 L207.03,207.52 L207.73,217.40 L208.44,223.29 L209.14,226.13 L209.84,227.54 L210.55,229.69 L211.25,233.64 L211.95,238.77 L212.66,242.92 L213.36,242.56 L214.06,234.76 L214.77,219.94 L215.47,202.53 L216.17,187.29 L216.88,176.61 L217.58,170.44 L218.28,168.48 L218.98,170.20 L219.69,173.54 L220.39,177.28 L221.09,182.83 L221.80,192.08 L222.50,203.85 L223.20,215.30 L223.91,225.25 L224.61,234.58 L225.31,244.33 L226.02,252.82 L226.72,254.66 L227.42,244.74 L228.13,224.42 L228.83,202.17 L229.53,185.76 L230.23,177.65 L230.94,176.75 L231.64,180.95 L232.34,186.62 L233.05,189.63 L233.75,188.98 L234.45,187.59 L235.16,187.67 L235.86,188.21 L236.56,188.23 L237.27,190.43 L237.97,197.52 L238.67,208.72 L239.38,221.53 L240.08,232.00 L240.78,233.76 L241.48,223.83 L242.19,207.65 L242.89,193.10 L243.59,183.39 L244.30,178.93" fill="none" stroke="#285F8F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="322" class="mono">X ∈ R<tspan baseline-shift="super" font-size="9">T×C</tspan></text>

    <!-- Fixed target path. -->
  <rect x="300" y="35" width="520" height="135" rx="16" class="fixed-field"/>
  <circle cx="322" cy="58" r="5" fill="#26796F"/>
  <text x="336" y="63" class="lane fixed-text">FIXED TARGET · NO GRADIENT</text>
  <rect x="320" y="75" width="225" height="75" rx="12" class="fixed-node"/>
  <g transform="translate(336 96)" color="#26796F"><use href="#lock-icon" xlink:href="#lock-icon"/></g>
  <text x="365" y="103" class="title">per-channel TSFEL</text>
  <text x="365" y="126" class="body">statistical · temporal · spectral</text>
  <text x="365" y="143" class="small">fixed · precompute once</text>
  <rect x="575" y="75" width="220" height="75" rx="12" class="fixed-node"/>
  <text x="595" y="103" class="title">standardized f(X)</text>
  <text x="595" y="126" class="body">concatenate per channel</text>
  <text x="595" y="143" class="small">fit once, then fixed · d = n<tspan baseline-shift="sub" font-size="9">f</tspan> × C</text>

    <!-- Trainable prediction path. -->
  <rect x="300" y="190" width="520" height="145" rx="16" class="train-field"/>
  <circle cx="322" cy="213" r="5" fill="#285F8F"/>
  <text x="336" y="218" class="lane train-text">TRAINED DURING PRETRAINING · UPDATE θ, φ</text>
  <rect x="320" y="228" width="330" height="90" rx="12" class="train-node"/>
  <text x="337" y="250" class="title">encoder Eθ</text>
  <text x="632" y="250" text-anchor="end" class="small">choose one per run</text>

  <g transform="translate(340 262)">
    <path d="M2,4 L18,2 M2,4 L18,12 M2,14 L18,2 M2,14 L18,12 M18,2 L34,7 M18,12 L34,7" class="glyph"/>
    <circle cx="2" cy="4" r="2.6" class="glyph-fill"/><circle cx="2" cy="14" r="2.6" class="glyph-fill"/>
    <circle cx="18" cy="2" r="2.6" class="glyph-fill"/><circle cx="18" cy="12" r="2.6" class="glyph-fill"/>
    <circle cx="34" cy="7" r="2.6" class="glyph-fill"/>
    <text x="18" y="35" text-anchor="middle" class="arch">MLP</text>
  </g>

  <g transform="translate(415 261)">
    <rect x="1" y="1" width="8" height="8" class="glyph"/><rect x="11" y="1" width="8" height="8" class="glyph"/><rect x="21" y="1" width="8" height="8" class="glyph"/>
    <rect x="1" y="11" width="8" height="8" class="glyph"/><rect x="11" y="11" width="8" height="8" class="glyph"/><rect x="21" y="11" width="8" height="8" class="glyph"/>
    <path d="M-2,10 H32 M15,-2 V22" class="glyph"/>
    <text x="15" y="36" text-anchor="middle" class="arch">MLP-Mixer</text>
  </g>

  <g transform="translate(500 261)">
    <rect x="1" y="4" width="9" height="16" rx="2" class="glyph"/><rect x="16" y="4" width="9" height="16" rx="2" class="glyph"/><rect x="31" y="4" width="9" height="16" rx="2" class="glyph"/>
    <path d="M10,12 H16 M25,12 H31 M5,4 C5,-2 36,-2 36,4" class="glyph"/>
    <text x="20" y="36" text-anchor="middle" class="arch">1D ResNet-18</text>
  </g>

  <g transform="translate(590 261)">
    <rect x="0" y="7" width="8" height="10" class="glyph"/><rect x="11" y="7" width="8" height="10" class="glyph"/><rect x="22" y="7" width="8" height="10" class="glyph"/>
    <path d="M31,12 H37" class="glyph"/>
    <rect x="38" y="3" width="18" height="18" rx="3" class="glyph"/>
    <path d="M42,7 L52,17 M52,7 L42,17" class="glyph"/>
    <text x="28" y="36" text-anchor="middle" class="arch">PatchTST</text>
  </g>

  <rect x="670" y="228" width="130" height="90" rx="12" class="train-node"/>
  <text x="735" y="251" text-anchor="middle" class="head-title">head Pφ</text>
  <text x="735" y="272" text-anchor="middle" class="body">trained · f<tspan baseline-shift="sub" font-size="10">pred</tspan>(X)</text>
  <g transform="translate(700 282)">
    <rect x="0" y="10" width="12" height="18" rx="2" fill="#285F8F" opacity=".42"/>
    <rect x="19" y="6" width="12" height="22" rx="2" fill="#285F8F" opacity=".67"/>
    <rect x="38" y="2" width="12" height="26" rx="2" fill="#285F8F"/>
    <path d="M53,15 H66" class="glyph" marker-end="url(#arrow-blue)"/>
  </g>

    <!-- Loss. -->
  <rect x="900" y="105" width="275" height="155" rx="17" class="loss-node"/>
  <text x="1037.5" y="135" text-anchor="middle" class="lane brick-text">DESCRIPTOR-PREDICTION LOSS</text>
  <text x="1037.5" y="178" text-anchor="middle" class="equation">MSE(f<tspan baseline-shift="sub" font-size="15">pred</tspan>, f)</text>
  <line x1="930" y1="196" x2="1145" y2="196" stroke="#E6C8C2" stroke-width="1"/>
  <text x="1037.5" y="222" text-anchor="middle" class="body-strong">updates θ and φ only</text>
  <text x="1037.5" y="242" text-anchor="middle" class="small">target path receives no gradient</text>

  <!-- Transition into downstream evaluation. -->
  <line x1="20" y1="360" x2="1175" y2="360" stroke="#D7DDE1" stroke-width="1.2"/>
  <text x="20" y="384" class="lane gold-text">AFTER PRETRAINING</text>
  <text x="210" y="384" class="body-strong">discard Pφ · keep Eθ · attach a new task head Hψ</text>
  <text x="1175" y="384" text-anchor="end" class="small">same pretrained encoder · evaluated separately</text>

  <!-- Frozen transfer. -->
  <rect x="20" y="397" width="550" height="88" rx="14" class="transfer-field"/>
  <text x="38" y="420" class="lane gold-text">FROZEN ENCODER</text>
  <rect x="38" y="427" width="152" height="37" rx="9" class="fixed-node"/>
  <g transform="translate(51 437) scale(.75)" color="#26796F"><use href="#lock-icon" xlink:href="#lock-icon"/></g>
  <text x="118" y="451" text-anchor="middle" class="body-strong">encoder Eθ</text>
  <rect x="226" y="427" width="132" height="37" rx="9" class="train-node"/>
  <circle cx="243" cy="445.5" r="4" fill="#285F8F"/>
  <text x="292" y="451" text-anchor="middle" class="body-strong">task head Hψ</text>
  <rect x="398" y="427" width="152" height="37" rx="9" class="node"/>
  <text x="474" y="445" text-anchor="middle" class="body-strong">task output</text>
  <text x="474" y="458" text-anchor="middle" class="small">class / heart rate</text>
  <text x="38" y="480" class="state">θ fixed · train ψ only</text>

  <!-- End-to-end transfer. -->
  <rect x="600" y="397" width="575" height="88" rx="14" class="transfer-field"/>
  <text x="618" y="420" class="lane gold-text">END-TO-END FINE-TUNING</text>
  <rect x="618" y="427" width="152" height="37" rx="9" class="train-node"/>
  <circle cx="635" cy="445.5" r="4" fill="#285F8F"/>
  <text x="700" y="451" text-anchor="middle" class="body-strong">encoder Eθ</text>
  <rect x="806" y="427" width="132" height="37" rx="9" class="train-node"/>
  <circle cx="823" cy="445.5" r="4" fill="#285F8F"/>
  <text x="872" y="451" text-anchor="middle" class="body-strong">task head Hψ</text>
  <rect x="978" y="427" width="177" height="37" rx="9" class="node"/>
  <text x="1066.5" y="445" text-anchor="middle" class="body-strong">task output</text>
  <text x="1066.5" y="458" text-anchor="middle" class="small">class / heart rate</text>
  <text x="618" y="480" class="state">update θ and ψ</text>
  <!-- Input display transform: least-squares linear detrend, then divide by population SD 59.899237876378. -->
</svg>
