<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Feature-informed pretraining and downstream transfer</title>
  <desc id="desc">An authentic PPG example window splits into a fixed TSFEL target path and a trainable neural prediction path. One of four alternative encoder backbones and a feature head are trained with mean squared error. After pretraining the feature head is discarded; a new task head is trained either with the encoder frozen or with the encoder fine-tuned.</desc>
  <style>
    .lane{font:600 15px 'JetBrains Mono','SFMono-Regular',monospace;letter-spacing:1.15px;text-transform:uppercase}
    .title{font:700 20px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .head-title{font:700 18px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .body{font:500 14px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#40505D}
    .body-strong{font:650 14px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .small{font:500 12.5px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#6D7881}
    .mono{font:500 12.5px 'JetBrains Mono','SFMono-Regular',monospace;fill:#40505D}
    .state{font:600 13.5px 'JetBrains Mono','SFMono-Regular',monospace;fill:#40505D}
    .arch{font:600 13.5px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .equation{font:700 23px 'Work Sans','Avenir Next',Arial,sans-serif;fill:#17212B}
    .fixed-field{fill:#EEF6F4;stroke:#26796F;stroke-width:1.5}
    .train-field{fill:#EEF3F8;stroke:#285F8F;stroke-width:1.5}
    .transfer-field{fill:#FAF6EC;stroke:#A36F24;stroke-width:1.35}
    .node{fill:#FFFFFF;stroke:#D7DDE1;stroke-width:1.2}
    .fixed-node{fill:#FFFFFF;stroke:#26796F;stroke-width:1.45}
    .train-node{fill:#FFFFFF;stroke:#285F8F;stroke-width:1.45}
    .loss-node{fill:#FBF1EE;stroke:#A63D32;stroke-width:1.55}
    .flow{fill:none;stroke:#17212B;stroke-width:2;stroke-linejoin:round}
    .fixed-flow{fill:none;stroke:#26796F;stroke-width:2;stroke-linejoin:round}
    .train-flow{fill:none;stroke:#285F8F;stroke-width:2;stroke-linejoin:round}
    .transfer-flow{fill:none;stroke:#6D7881;stroke-width:2.05;stroke-linejoin:round}
    .reuse-flow{fill:none;stroke:#6D7881;stroke-width:1.7;stroke-dasharray:6 5;stroke-linejoin:round}
    .glyph{fill:none;stroke:#285F8F;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
    .glyph-fill{fill:#285F8F}
    .fixed-text{fill:#26796F}
    .train-text{fill:#285F8F}
    .brick-text{fill:#A63D32}
    .gold-text{fill:#A36F24}
  </style>
  <defs>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#17212B"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#26796F"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#285F8F"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#A36F24"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6D7881"/>
    </marker>
    <clipPath id="input-clip"><rect x="39" y="151" width="140" height="52" rx="4"/></clipPath>
    <g id="lock-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="7" width="14" height="11" rx="2"/>
      <path d="M4,7V4.7A4,4 0 0 1 12,4.7V7"/>
      <path d="M8,11v3"/>
    </g>
  </defs>

  <!-- Connectors are intentionally drawn before nodes. -->
  <path d="M195,170 H225 V102 H255" class="flow" marker-end="url(#arrow-ink)"/>
  <path d="M225,170 V260 H255" class="flow" marker-end="url(#arrow-ink)"/>
  <path d="M520,105 H550" class="fixed-flow" marker-end="url(#arrow-teal)"/>
  <path d="M795,105 H850 V150 H900" class="fixed-flow" marker-end="url(#arrow-teal)"/>
  <path d="M630,268 H660" class="train-flow" marker-end="url(#arrow-blue)"/>
  <path d="M800,268 H850 V220 H900" class="train-flow" marker-end="url(#arrow-blue)"/>
  <path d="M455,318 V353" class="reuse-flow" marker-end="url(#arrow-muted)"/>
  <path d="M190,438 H226" class="transfer-flow" marker-end="url(#arrow-muted)"/>
  <path d="M358,438 H398" class="transfer-flow" marker-end="url(#arrow-muted)"/>
  <path d="M770,438 H806" class="transfer-flow" marker-end="url(#arrow-muted)"/>
  <path d="M938,438 H978" class="transfer-flow" marker-end="url(#arrow-muted)"/>

  <!-- Authentic input example. -->
  <rect x="20" y="95" width="175" height="150" rx="15" class="node"/>
  <text x="38" y="123" class="title">input window X</text>
  <text x="38" y="143" class="small">PPG-DaLiA · 8 s example</text>
  <rect x="38" y="151" width="142" height="52" rx="4" fill="#F7F9FA" stroke="#EDF0F1"/>
  <g clip-path="url(#input-clip)">
    <image x="39" y="151" width="140" height="52" preserveAspectRatio="none" href="data:image/svg+xml;base64,"/>
  </g>
  <text x="38" y="228" class="mono">X ∈ R<tspan baseline-shift="super" font-size="9">T×C</tspan></text>

  <!-- Fixed target path. -->
  <rect x="255" y="35" width="565" height="135" rx="16" class="fixed-field"/>
  <circle cx="277" cy="58" r="5" fill="#26796F"/>
  <text x="291" y="63" class="lane fixed-text">FIXED TARGET · NO GRADIENT</text>
  <rect x="275" y="75" width="245" height="75" rx="12" class="fixed-node"/>
  <g transform="translate(291 96)" color="#26796F"><use href="#lock-icon" xlink:href="#lock-icon"/></g>
  <text x="320" y="103" class="title">per-channel TSFEL</text>
  <text x="320" y="126" class="body">statistical · temporal · spectral</text>
  <text x="320" y="143" class="small">fixed · precompute once</text>
  <rect x="550" y="75" width="245" height="75" rx="12" class="fixed-node"/>
  <text x="570" y="103" class="title">standardized f(X)</text>
  <text x="570" y="126" class="body">concatenate per channel</text>
  <text x="570" y="143" class="small">fit once, then fixed · d = n<tspan baseline-shift="sub" font-size="9">f</tspan> × C</text>

  <!-- Trainable prediction path. -->
  <rect x="255" y="190" width="565" height="145" rx="16" class="train-field"/>
  <circle cx="277" cy="213" r="5" fill="#285F8F"/>
  <text x="291" y="218" class="lane train-text">TRAINED DURING PRETRAINING · UPDATE θ, φ</text>
  <rect x="275" y="228" width="355" height="90" rx="12" class="train-node"/>
  <text x="292" y="250" class="title">encoder Eθ <tspan class="small">· choose one per run</tspan></text>

  <!-- MLP glyph. -->
  <g transform="translate(298 262)">
    <path d="M2,4 L18,2 M2,4 L18,12 M2,14 L18,2 M2,14 L18,12 M18,2 L34,7 M18,12 L34,7" class="glyph"/>
    <circle cx="2" cy="4" r="2.6" class="glyph-fill"/><circle cx="2" cy="14" r="2.6" class="glyph-fill"/>
    <circle cx="18" cy="2" r="2.6" class="glyph-fill"/><circle cx="18" cy="12" r="2.6" class="glyph-fill"/>
    <circle cx="34" cy="7" r="2.6" class="glyph-fill"/>
    <text x="18" y="35" text-anchor="middle" class="arch">MLP</text>
  </g>

  <!-- MLP-Mixer glyph. -->
  <g transform="translate(377 261)">
    <rect x="1" y="1" width="8" height="8" class="glyph"/><rect x="11" y="1" width="8" height="8" class="glyph"/><rect x="21" y="1" width="8" height="8" class="glyph"/>
    <rect x="1" y="11" width="8" height="8" class="glyph"/><rect x="11" y="11" width="8" height="8" class="glyph"/><rect x="21" y="11" width="8" height="8" class="glyph"/>
    <path d="M-2,10 H32 M15,-2 V22" class="glyph"/>
    <text x="15" y="36" text-anchor="middle" class="arch">MLP-Mixer</text>
  </g>

  <!-- ResNet glyph. -->
  <g transform="translate(466 261)">
    <rect x="1" y="4" width="9" height="16" rx="2" class="glyph"/><rect x="16" y="4" width="9" height="16" rx="2" class="glyph"/><rect x="31" y="4" width="9" height="16" rx="2" class="glyph"/>
    <path d="M10,12 H16 M25,12 H31 M5,4 C5,-2 36,-2 36,4" class="glyph"/>
    <text x="20" y="36" text-anchor="middle" class="arch">1D ResNet-18</text>
  </g>

  <!-- PatchTST glyph. -->
  <g transform="translate(568 261)">
    <rect x="0" y="7" width="8" height="10" class="glyph"/><rect x="11" y="7" width="8" height="10" class="glyph"/><rect x="22" y="7" width="8" height="10" class="glyph"/>
    <path d="M31,12 H37" class="glyph"/>
    <rect x="38" y="3" width="18" height="18" rx="3" class="glyph"/>
    <path d="M42,7 L52,17 M52,7 L42,17" class="glyph"/>
    <text x="28" y="36" text-anchor="middle" class="arch">PatchTST</text>
  </g>

  <rect x="660" y="228" width="140" height="90" rx="12" class="train-node"/>
  <text x="730" y="251" text-anchor="middle" class="head-title">feature head Pφ</text>
  <text x="730" y="272" text-anchor="middle" class="body">trained · f<tspan baseline-shift="sub" font-size="10">pred</tspan>(X)</text>
  <g transform="translate(695 282)">
    <rect x="0" y="10" width="12" height="18" rx="2" fill="#285F8F" opacity=".42"/>
    <rect x="19" y="6" width="12" height="22" rx="2" fill="#285F8F" opacity=".67"/>
    <rect x="38" y="2" width="12" height="26" rx="2" fill="#285F8F"/>
    <path d="M53,15 H66" class="glyph" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Loss. -->
  <rect x="900" y="105" width="275" height="155" rx="17" class="loss-node"/>
  <text x="1037.5" y="135" text-anchor="middle" class="lane brick-text">DESCRIPTOR-PREDICTION LOSS</text>
  <text x="1037.5" y="178" text-anchor="middle" class="equation">MSE(f<tspan baseline-shift="sub" font-size="15">pred</tspan>, f)</text>
  <line x1="930" y1="196" x2="1145" y2="196" stroke="#E6C8C2" stroke-width="1"/>
  <text x="1037.5" y="222" text-anchor="middle" class="body-strong">updates θ and φ only</text>
  <text x="1037.5" y="242" text-anchor="middle" class="small">target path receives no gradient</text>

  <!-- Transition into downstream evaluation. -->
  <line x1="20" y1="360" x2="1175" y2="360" stroke="#D7DDE1" stroke-width="1.2"/>
  <text x="20" y="384" class="lane gold-text">AFTER PRETRAINING</text>
  <text x="210" y="384" class="body-strong">discard Pφ · keep Eθ · attach a new task head Hψ</text>
  <text x="1175" y="384" text-anchor="end" class="small">same pretrained encoder · evaluated separately</text>

  <!-- Frozen transfer. -->
  <rect x="20" y="397" width="550" height="88" rx="14" class="transfer-field"/>
  <text x="38" y="420" class="lane gold-text">FROZEN ENCODER</text>
  <rect x="38" y="427" width="152" height="37" rx="9" class="fixed-node"/>
  <g transform="translate(51 437) scale(.75)" color="#26796F"><use href="#lock-icon" xlink:href="#lock-icon"/></g>
  <text x="118" y="451" text-anchor="middle" class="body-strong">encoder Eθ</text>
  <rect x="226" y="427" width="132" height="37" rx="9" class="train-node"/>
  <circle cx="243" cy="445.5" r="4" fill="#285F8F"/>
  <text x="292" y="451" text-anchor="middle" class="body-strong">task head Hψ</text>
  <rect x="398" y="427" width="152" height="37" rx="9" class="node"/>
  <text x="474" y="445" text-anchor="middle" class="body-strong">task output</text>
  <text x="474" y="458" text-anchor="middle" class="small">class / heart rate</text>
  <text x="38" y="480" class="state">θ fixed · train ψ only</text>

  <!-- End-to-end transfer. -->
  <rect x="600" y="397" width="575" height="88" rx="14" class="transfer-field"/>
  <text x="618" y="420" class="lane gold-text">END-TO-END FINE-TUNING</text>
  <rect x="618" y="427" width="152" height="37" rx="9" class="train-node"/>
  <circle cx="635" cy="445.5" r="4" fill="#285F8F"/>
  <text x="700" y="451" text-anchor="middle" class="body-strong">encoder Eθ</text>
  <rect x="806" y="427" width="132" height="37" rx="9" class="train-node"/>
  <circle cx="823" cy="445.5" r="4" fill="#285F8F"/>
  <text x="872" y="451" text-anchor="middle" class="body-strong">task head Hψ</text>
  <rect x="978" y="427" width="177" height="37" rx="9" class="node"/>
  <text x="1066.5" y="445" text-anchor="middle" class="body-strong">task output</text>
  <text x="1066.5" y="458" text-anchor="middle" class="small">class / heart rate</text>
  <text x="618" y="480" class="state">update θ and ψ</text>
</svg>
