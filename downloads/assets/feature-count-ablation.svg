<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <style>
    .ink{fill:#16324F}.muted{fill:#68798A}.dalia{fill:#178C8C;stroke:#178C8C}.hhar{fill:#D96C35;stroke:#D96C35}
    .h{font:700 34px 'Work Sans',Arial,sans-serif}.label{font:650 24px 'Work Sans',Arial,sans-serif}.body{font:400 21px 'Work Sans',Arial,sans-serif}
    .value{font:650 18px 'Work Sans',Arial,sans-serif}.axis{font:400 18px 'Work Sans',Arial,sans-serif}.small{font:400 17px 'Work Sans',Arial,sans-serif}
    .grid{stroke:#D8DEE6;stroke-width:2}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <circle cx="1190" cy="37" r="9" class="dalia"/><text x="1210" y="45" class="body ink">PPG-Dalia</text>
  <circle cx="1400" cy="37" r="9" class="hhar"/><text x="1420" y="45" class="body ink">HHAR</text>

  <!-- rank 3..7: y 620..120; lower rank lower on chart -->
  <g class="grid"><path d="M180 120 H1510"/><path d="M180 245 H1510"/><path d="M180 370 H1510"/><path d="M180 495 H1510"/><path d="M180 620 H1510"/></g>
  <g class="axis muted" text-anchor="end"><text x="158" y="127">7</text><text x="158" y="252">6</text><text x="158" y="377">5</text><text x="158" y="502">4</text><text x="158" y="627">3</text></g>
  <text x="52" y="405" transform="rotate(-90 52 405)" class="body ink">Average rank ↓</text>

  <!-- numeric x scale 15..90: x 240,480,720,1440 -->
  <g class="axis muted" text-anchor="middle"><text x="240" y="674">15</text><text x="480" y="674">30</text><text x="720" y="674">45</text><text x="1440" y="674">90</text></g>
  <text x="840" y="722" text-anchor="middle" class="body ink">TSFEL descriptors per channel</text>

  <!-- y = 620 - (rank-3)*125 -->
  <path d="M240 501.3 L480 476.3 L720 167.5 L1440 260" style="fill:none;stroke:#178C8C;stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M240 415 L480 425 L720 525 L1440 448.8" style="fill:none;stroke:#D96C35;stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/>
  <g class="dalia"><circle cx="240" cy="501.3" r="12"/><circle cx="480" cy="476.3" r="12"/><circle cx="720" cy="167.5" r="12"/><circle cx="1440" cy="260" r="12"/></g>
  <g class="hhar"><circle cx="240" cy="415" r="12"/><circle cx="480" cy="425" r="12"/><circle cx="720" cy="525" r="12"/><circle cx="1440" cy="448.8" r="12"/></g>
  <g class="value ink" text-anchor="middle"><text x="240" y="536">3.95</text><text x="480" y="511">4.15</text><text x="720" y="147">6.62</text><text x="1440" y="239">5.88</text><text x="240" y="394">4.64</text><text x="480" y="404">4.56</text><text x="720" y="560">3.76</text><text x="1440" y="484">4.37</text></g>
</svg>
